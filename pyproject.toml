[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "metatraderx"
dynamic = ["version"]
description = "Universal MetaTrader 5 and MetaTrader 4 Python API for Windows, Linux and macOS"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bradley Odimmasi" }]
requires-python = ">=3.10"
keywords = ["metatrader", "metatrader5", "mt5", "mt4", "trading", "forex", "wine", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]
build = ["build>=1.0", "twine>=5.0"]
dev = ["metatraderx[build,pandas]", "pytest>=8", "pytest-cov>=5", "ruff"]

[project.scripts]
mtx = "metatraderx.cli:main"
metatraderx = "metatraderx.cli:main"

[project.urls]
Homepage = "https://github.com/KshRaven/metatraderx"
Documentation = "https://kshraven.github.io/metatraderx/"
Source = "https://github.com/KshRaven/metatraderx"
Issues = "https://github.com/KshRaven/metatraderx/issues"
Changelog = "https://github.com/KshRaven/metatraderx/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "metatraderx._version.__version__" }

[tool.setuptools.packages.find]
include = ["metatraderx*"]

[tool.setuptools.package-data]
metatraderx = ["py.typed", "*.pyi", "mql/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["metatraderx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "I"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["metatraderx"]

[tool.ruff.lint.per-file-ignores]
"metatraderx/_version.py" = ["I002"]
"metatraderx/_worker.py" = ["I001"]
"tests/*" = ["I001"]
"scripts/*" = ["I001", "I002", "F401"]
"metatraderx/__init__.py" = ["F401"]
"*.pyi" = ["I001", "I002"]
